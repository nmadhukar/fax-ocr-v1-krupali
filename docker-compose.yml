# ============================================================================
# Healthcare Fax OCR Pipeline — Full-Stack Docker Compose
# Usage: docker compose up -d
# ============================================================================

services:
  # ---- Infrastructure ----

  postgres:
    image: pgvector/pgvector:pg15
    container_name: fax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faxadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faxpass123}
      POSTGRES_DB: ${POSTGRES_DB:-fax_processor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faxadmin -d fax_processor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fax_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-changeme} ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-29T03-56-32Z
    container_name: fax_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: fax_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb myminio/fax-documents --ignore-existing;
      mc mb myminio/templates --ignore-existing;
      mc anonymous set none myminio/fax-documents;
      mc anonymous set none myminio/templates;
      echo 'Buckets created successfully (private, no anonymous access)';
      exit 0;
      "

  # ---- Application Services ----

  fax-ingress:
    build: .
    container_name: fax_ingress
    restart: unless-stopped
    env_file: .env.docker
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn services.fax_ingress_api.main:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - model_cache:/app/.cache/huggingface
      - paddle_cache:/app/.cache/paddleocr

  fax-review:
    build: .
    container_name: fax_review
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn services.fax_review_api.main:app --host 0.0.0.0 --port 8002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  fax-query:
    build: .
    container_name: fax_query
    restart: unless-stopped
    env_file: .env.docker
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn services.fax_query_api.main:app --host 0.0.0.0 --port 8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  fax-worker:
    build: .
    container_name: fax_worker
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      fax-ingress:
        condition: service_healthy
    command: celery -A workers.fax_processing_worker.celery_app worker --loglevel=info --pool=solo
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    volumes:
      - model_cache:/app/.cache/huggingface
      - paddle_cache:/app/.cache/paddleocr
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.fax_processing_worker.celery_app inspect ping --timeout 10 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s

  fax-beat:
    build: .
    container_name: fax_beat
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      fax-worker:
        condition: service_started
    command: celery -A workers.fax_processing_worker.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
  paddle_cache:

networks:
  default:
    name: fax_network
