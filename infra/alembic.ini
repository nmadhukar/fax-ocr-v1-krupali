# Alembic Configuration

[alembic]
# Path to migration scripts
script_location = migrations

# Template used for new migration scripts
# file_template = %%(rev)s_%%(slug)s

# Truncate the revision string to this number of characters
# truncate_slug_length = 40

# Set to 'true' to run environment.py when generating
# new revision files, not just when running migration commands
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files to be included
# in the migration's file listing
# sourceless = false

# Database URL - MUST be overridden by DATABASE_URL env var or alembic env.py
# DO NOT put real credentials here; this is a placeholder.
sqlalchemy.url = postgresql+psycopg2://user:CHANGE_ME@localhost:5432/fax_processor


[post_write_hooks]
# Uncomment to enable automatic code formatting on new migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
